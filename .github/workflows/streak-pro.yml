name: Pro GitHub Streak Keeper

permissions:
  contents: write

on:
  schedule:
    - cron: '0 15 * * *'   # primary run
    - cron: '30 15 * * *'  # backup run, in case GitHub drops the primary one
  workflow_dispatch:

jobs:
  check-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check GitHub contributions via API
        id: activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USERNAME=${{ github.actor }}
          TODAY=$(date -u +"%Y-%m-%d")

          echo "Checking activity for $USERNAME on $TODAY"

          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$USERNAME/events")

          COUNT=$(echo "$RESPONSE" | jq "[.[] | select(.created_at | startswith(\"$TODAY\"))] | length" 2>/dev/null || echo 0)

          echo "Activity count: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "has_activity=true" >> $GITHUB_OUTPUT
          else
            echo "has_activity=false" >> $GITHUB_OUTPUT
          fi

          # Prevent duplicate alerts if both the primary and backup cron fire on the same day
          if grep -q "$TODAY" streak.txt 2>/dev/null; then
            echo "already_alerted=true" >> $GITHUB_OUTPUT
          else
            echo "already_alerted=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram alert
        if: steps.activity.outputs.has_activity == 'false' && steps.activity.outputs.already_alerted == 'false'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="⚠️ No GitHub activity today! Your streak is at risk!"

      - name: Commit if no activity
        if: steps.activity.outputs.has_activity == 'false' && steps.activity.outputs.already_alerted == 'false'
        run: |
          echo "No activity detected. Saving streak..."
          date >> streak.txt
          git config user.name "github-actions"
          git config user.email "kaomeyly@gmail.com"
          git add streak.txt
          git commit -m "Auto streak save" || echo "No changes"
          git push

      - name: Skip commit
        if: steps.activity.outputs.has_activity == 'true'
        run: echo "You already contributed today!"